name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attendance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/attendance
      JWT_SECRET: e2e-ci-jwt-secret-not-for-production
      PORT: '4000'
      NODE_ENV: production
      CLIENT_ORIGIN: http://127.0.0.1:4000,http://localhost:4000
      SCHOOL_TIMEZONE: Asia/Kolkata
      E2E_BASE_URL: http://127.0.0.1:4000/
      E2E_EMAIL: incharge@brightfuture.edu.in
      E2E_PASSWORD: password123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Migrate database
        run: npx prisma migrate deploy
        working-directory: server

      - name: Seed database
        run: node prisma/seed.js
        working-directory: server

      - name: Build frontend
        run: npm run build
        env:
          # Same-origin /api via Express static in production
          VITE_API_URL: ''
          VITE_USE_MOCK: 'false'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
          retention-days: 7
