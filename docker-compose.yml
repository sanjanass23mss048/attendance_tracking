services:
  postgres:
    image: postgres:16
    container_name: attendance-postgres
    restart: unless-stopped
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: attendance
    volumes:
      - attendance_pg_data:/var/lib/postgresql/data

volumes:
  attendance_pg_data:
